esphome:
  name: esphome-kessel
  friendly_name: "ESPHome Kesseltemperatur"
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    chipset: ws2812
    rgb_order: RGB
    pin: GPIO21
    num_leds: 1
    default_transition_length: 500ms
    name: "Status NeoPixel"

one_wire:
  - platform: gpio
    pin: GPIO01
    id: one_wire_01
  - platform: gpio
    pin: GPIO2
    id: one_wire_02
  - platform: gpio
    pin: GPIO7
    id: one_wire_03
  - platform: gpio
    pin: GPIO4
    id: one_wire_04
  - platform: gpio
    pin: GPIO5
    id: one_wire_05
  - platform: gpio
    pin: GPIO6
    id: one_wire_06

sensor:
  - platform: dallas_temp
    id: temperature_oben
    name: "Kessel oben"
    update_interval: 60s
    one_wire_id: one_wire_01
  - platform: dallas_temp
    id: temperature_mitte
    name: "Kessel mitte"
    update_interval: 60s
    one_wire_id: one_wire_02
  - platform: dallas_temp
    id: temperature_unten
    name: "Kessel unten"
    update_interval: 60s
    one_wire_id: one_wire_03
  - platform: dallas_temp
    id: temperature_vl
    name: "Vorlauf"
    update_interval: 60s
    one_wire_id: one_wire_04
  - platform: dallas_temp
    id: temperature_rl
    name: "Rücklauf"
    update_interval: 60s
    one_wire_id: one_wire_05
  - platform: dallas_temp
    id: temperature_room
    name: "Raumtemperatur"
    update_interval: 60s
    one_wire_id: one_wire_06
