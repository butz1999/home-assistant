esphome:
  name: "esphome-lueftung"
  friendly_name: "ESPHome Lüftung"
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot: 
    then:
      - delay: 1s
      - fan.turn_on: 
          id: luefter
          speed: 1

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: filter_aktiv
    type: bool
    restore_value: no
    initial_value: 'false'

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    chipset: ws2812
    rgb_order: RGB
    pin: GPIO38
    num_leds: 1
    name: "Status NeoPixel"
    effects:
      - strobe:
          name: "Blinken"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 68%
              blue: 0%
              duration: 300ms
            - state: false
              duration: 300ms

output:
  - platform: gpio
    pin: GPIO5
    id: output_stufe_1
  - platform: gpio
    pin: GPIO6
    id: output_stufe_2
  - platform: gpio
    pin: GPIO7
    id: output_stufe_3

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true    
      inverted: true
    id: input_stufe_1
    name: "Stufe 1"
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return not((id(luefter).speed == 1) and (id(luefter).state));'
            then:
              - fan.turn_on:
                  id: luefter
                  speed: 1
            else:
              - fan.turn_off:
                  id: luefter

  - platform: gpio
    pin:
      number: GPIO11
      mode:
        input: true
        pullup: true
      inverted: true
    id: input_stufe_2
    name: "Stufe 2"
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return not((id(luefter).speed == 2) and (id(luefter).state));'
            then:
              - fan.turn_on:
                  id: luefter
                  speed: 2
            else:
              - fan.turn_off:
                  id: luefter

  - platform: gpio
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    id: input_stufe_3
    name: "Stufe 3"
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return not((id(luefter).speed == 3) and (id(luefter).state));'
            then:
              - fan.turn_on:
                  id: luefter
                  speed: 3
            else:
              - fan.turn_off:
                  id: luefter

sensor:
  - platform: adc
    pin: GPIO14
    name: "Filterwarnung"
    attenuation: 12db
    samples: 10
    sampling_mode: avg
    update_interval: 100ms
    filters:
      - multiply: 0.77 # Ergibt ~3.8V max ADC in
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10
          send_first_at: 1
      - heartbeat: 60s
    on_value_range:
      - above: 2.0  # Schwellenwert anpassen!
        then:
          - lambda: 'id(filter_aktiv) = true;'
            # Blinken wenn Filterwarnung aktiv
          - light.turn_on:
              id: status_led
              effect: "Blinken"  # Name des Effekts aus der 'effects' Liste
              red: 100%
              green: 0%
              blue: 0%

      - below: 2.0
        then:
          - lambda: |-
              id(filter_aktiv) = false;
              // Trigger von on_state
              id(luefter).publish_state(); 

switch:
  - platform: output
    name: "Stufe 1"
    output: output_stufe_1
    id: lueftung_stufe_1

  - platform: output
    name: "Stufe 2"
    output: output_stufe_2
    id: lueftung_stufe_2

  - platform: output
    name: "Stufe 3"
    output: output_stufe_3
    id: lueftung_stufe_3

  - platform: template
    name: "Filterwarnung"
    id: filterwarnung_schalter
    # Der Schalter zeigt den aktuellen Zustand der globalen Variable an
    lambda: |-
      return id(filter_aktiv);
    turn_on_action:
      - lambda: |-
          id(filter_aktiv) = true;
          id(luefter).publish_state();
      # Blinken starten
      - light.turn_on:
          id: status_led
          effect: "Blinken"
    turn_off_action:
      - lambda: |-
          id(filter_aktiv) = false;
          id(luefter).publish_state(); 

fan:
  - platform: template
    name: "Lüfter"
    id: luefter
    speed_count: 3
    restore_mode: ALWAYS_ON

    on_state:
      - lambda: |-
          id(lueftung_stufe_1).turn_off();
          id(lueftung_stufe_2).turn_off();
          id(lueftung_stufe_3).turn_off();
          auto rgbLED = id(status_led).turn_on();
          if (!id(filter_aktiv))
          {
            rgbLED.set_effect("None");
          }
          if (id(luefter).state)
          {
            if (id(luefter).speed == 1)
            {
              id(lueftung_stufe_1).turn_on();
              if (!id(filter_aktiv))
              {
                rgbLED.set_rgb(0.0, 1.0, 0.0);
                rgbLED.set_brightness(0.2);
                rgbLED.perform();
              }
            }
            else if (id(luefter).speed == 2)
            {
              id(lueftung_stufe_2).turn_on();
              if (!id(filter_aktiv))
              {
                rgbLED.set_rgb(0.0, 1.0, 1.0);
                rgbLED.set_brightness(0.3);
                rgbLED.perform();
              }
            } 
            else if (id(luefter).speed == 3)
            {
              id(lueftung_stufe_3).turn_on();
              if (!id(filter_aktiv))
              {
                rgbLED.set_rgb(0.0, 0.0, 1.0);
                rgbLED.set_brightness(1.0);
                rgbLED.perform();
              }
            }
          }
          else
          {
            if (!id(filter_aktiv))
            {
              rgbLED.set_effect("None");
              rgbLED.set_rgb(1.0, 0.0, 0.0);
              rgbLED.set_brightness(0.15);
              rgbLED.perform();
            }
          }
